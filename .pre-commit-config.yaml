minimum_pre_commit_version: 4.5.1
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=error"]
        files: ^scripts/.*\.sh$
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --locked --extra dev ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        args: ["--fix"]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --extra dev ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/opencode_a2a
        language: system
        pass_filenames: false
      - id: bash-n
        name: bash syntax check
        entry: bash -n
        language: system
        files: ^scripts/.*\.sh$
