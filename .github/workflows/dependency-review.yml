name: Review Dependency Health

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - "build-requirements/requirements.txt"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - "build-requirements/requirements.txt"
      - "uv.lock"
  schedule:
    # 03:00 UTC on day-of-month 1
    - cron: "0 3 1 * *"

permissions:
  contents: read

jobs:
  dependency-health:
    name: Audit Development and Build Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Run dependency health checks
        run: bash ./scripts/dependency_health.sh
        env:
          DEPENDENCY_AUDIT_OUTPUT_DIR: dependency-audit

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: dependency-audit/
          if-no-files-found: warn
          retention-days: 30
