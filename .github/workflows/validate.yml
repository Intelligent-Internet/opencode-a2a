name: Validate PRs and Main

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: Validate Default Toolchain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Sync locked dependencies
        run: uv sync --all-extras --frozen

      - name: Run lint checks
        run: bash ./scripts/lint.sh

      - name: Run test suite
        run: uv run pytest

      - name: Enforce coverage policy
        run: uv run python ./scripts/check_coverage.py

      - name: Export runtime requirements for vulnerability audit
        run: >
          uv export --format requirements.txt --no-dev --locked --no-emit-project
          --output-file /tmp/runtime-requirements.txt >/dev/null

      - name: Run runtime dependency vulnerability audit
        run: >
          uv run pip-audit --requirement /tmp/runtime-requirements.txt
          --disable-pip --require-hashes --strict

      - name: Clean previous build artifacts
        run: rm -rf build dist

      - name: Build package artifacts
        run: >
          uv build --no-sources --force-pep517
          --build-constraints build-requirements/requirements.txt
          --require-hashes

      - name: Smoke test built wheel
        run: bash ./scripts/smoke_test_built_cli.sh dist/opencode_a2a-*.whl

      - name: Smoke test built sdist
        run: bash ./scripts/smoke_test_built_cli.sh dist/opencode_a2a-*.tar.gz

  runtime-matrix:
    name: Validate Runtime Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Sync locked dependencies
        run: uv sync --all-extras --frozen

      - name: Run runtime regression tests
        run: uv run pytest --no-cov

  protobuf-compatibility:
    name: Validate Protobuf 6 Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Sync locked dependencies
        run: uv sync --all-extras --frozen

      - name: Install supported protobuf 6 release
        run: |
          uv pip install 'protobuf==6.33.6'
          uv pip check

      - name: Run protobuf 6 regression tests
        env:
          # Keep nested uv commands (including the conformance SUT) on protobuf 6.
          UV_NO_SYNC: "1"
        run: uv run pytest --no-cov
