name: Release Publish and Repair

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish or repair
        required: true
        type: string
      publish_to_pypi:
        description: Publish artifacts to PyPI before syncing the GitHub Release
        required: true
        default: false
        type: boolean
      sync_github_release:
        description: Create or repair the GitHub Release and release assets
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-and-audit:
    name: Build and Audit Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Verify release tag matches checkout
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: bash ./scripts/validate_release_tag.sh "${RELEASE_TAG}"

      - name: Run default regression baseline
        run: bash ./scripts/doctor.sh

      - name: Export runtime requirements for vulnerability audit
        run: >
          uv export --format requirements.txt --no-dev --locked --no-emit-project
          --output-file /tmp/runtime-requirements.txt >/dev/null

      - name: Run runtime dependency vulnerability audit
        run: >
          uv run pip-audit --requirement /tmp/runtime-requirements.txt
          --disable-pip --require-hashes --strict

      - name: Export development requirements for vulnerability audit
        run: >
          uv export --format requirements.txt --extra dev --no-dev --locked --no-emit-project
          --output-file /tmp/dev-requirements.txt >/dev/null

      - name: Run development dependency vulnerability audit
        run: >
          uv run pip-audit --requirement /tmp/dev-requirements.txt
          --disable-pip --require-hashes --strict

      - name: Run build dependency vulnerability audit
        run: >
          uv run pip-audit --requirement build-requirements/requirements.txt
          --disable-pip --require-hashes --strict

      - name: Clean previous build artifacts
        run: rm -rf build dist

      - name: Build package artifacts
        run: >
          uv build --no-sources --force-pep517
          --build-constraints build-requirements/requirements.txt
          --require-hashes

      - name: Verify published version matches tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib

          dist_dir = pathlib.Path("dist")
          wheels = sorted(dist_dir.glob("opencode_a2a-*.whl"))
          sdists = sorted(dist_dir.glob("opencode_a2a-*.tar.gz"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel in dist/, found {len(wheels)}")
          if len(sdists) != 1:
              raise SystemExit(f"Expected exactly one sdist in dist/, found {len(sdists)}")
          wheel = wheels[0].name
          sdist = sdists[0].name
          version = wheel.removeprefix("opencode_a2a-").split("-py3", 1)[0]
          sdist_version = sdist.removeprefix("opencode_a2a-").removesuffix(".tar.gz")
          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          if version != tag:
              raise SystemExit(f"Wheel version {version!r} does not match tag {tag!r}")
          if sdist_version != tag:
              raise SystemExit(f"sdist version {sdist_version!r} does not match tag {tag!r}")
          print(f"Validated release version: {version}")
          PY

      - name: Smoke test wheel artifact
        run: bash ./scripts/smoke_test_built_cli.sh dist/opencode_a2a-*.whl

      - name: Smoke test sdist artifact
        run: bash ./scripts/smoke_test_built_cli.sh dist/opencode_a2a-*.tar.gz

      - name: Generate runtime SBOM
        run: >
          uv run pip-audit --requirement /tmp/runtime-requirements.txt
          --disable-pip --require-hashes --strict
          --format cyclonedx-json --output dist/opencode-a2a.cdx.json

      - name: Generate release checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          dist_dir = Path("dist")
          assets = sorted(
              path
              for path in dist_dir.iterdir()
              if path.is_file() and path.name != "SHA256SUMS"
          )
          lines = [
              f"{hashlib.sha256(asset.read_bytes()).hexdigest()}  {asset.name}"
              for asset in assets
          ]
          (dist_dir / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish Verified Artifacts to PyPI
    needs: build-and-audit
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_pypi }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-dist
          path: dist

      - name: Verify release checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Prepare PyPI distribution set
        run: |
          mkdir -p pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: pypi-dist

  sync-release:
    name: Sync Verified GitHub Release
    needs:
      - build-and-audit
      - publish-pypi
    if: >-
      ${{
        always()
        && needs.build-and-audit.result == 'success'
        && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
        && (github.event_name != 'workflow_dispatch' || inputs.sync_github_release)
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-dist
          path: dist

      - name: Verify release checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Sync GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          retry() {
            local attempts="$1"
            local sleep_seconds="$2"
            shift 2

            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi

              if [ "$attempt" -ge "$attempts" ]; then
                echo "Command failed after ${attempts} attempts: $*" >&2
                return 1
              fi

              echo "Retrying (${attempt}/${attempts}) after transient failure: $*" >&2
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
            done
          }

          ensure_release() {
            if retry 3 5 gh release view "$RELEASE_TAG" --json url >/dev/null; then
              echo "Release ${RELEASE_TAG} already exists."
              return 0
            fi

            retry 3 5 gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          }

          ensure_release

          mapfile -t existing_assets < <(
            retry 3 5 gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'
          )

          for asset in dist/*.tar.gz dist/*.whl dist/*.cdx.json dist/SHA256SUMS; do
            asset_name="$(basename "$asset")"
            if printf '%s\n' "${existing_assets[@]}" | grep -Fxq "$asset_name"; then
              echo "Release asset already present: $asset_name"
              continue
            fi

            retry 3 5 gh release upload "$RELEASE_TAG" "$asset"
          done
