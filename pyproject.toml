[build-system]
requires = ["setuptools>=80", "setuptools-scm[toml]>=8,<10"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-a2a"
dynamic = ["version"]
description = "OpenCode A2A runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "liujuanjuan1984@Intelligent-Internet" },
]
keywords = ["a2a", "opencode", "fastapi", "json-rpc", "sse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "a2a-sdk==1.1.2",
    "aiosqlite>=0.20,<1.0",
    "fastapi>=0.139,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.14.2,<3.0",
    "protobuf>=6.33.5,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "sse-starlette>=2.1,<4.0",
    "uvicorn>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19.1,<2.0",
    "pip-audit>=2.9,<3.0",
    "pre-commit>=4.5.1,<5.0",
    "pygments>=2.20.0,<3.0",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.5,<0.16",
]

[project.scripts]
opencode-a2a = "opencode_a2a.cli:main"

[project.urls]
Homepage = "https://github.com/Intelligent-Internet/opencode-a2a"
Repository = "https://github.com/Intelligent-Internet/opencode-a2a"
Issues = "https://github.com/Intelligent-Internet/opencode-a2a/issues"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
package = true
# Keep transitive dependency floors above versions with known vulnerabilities:
# - click < 8.3.3: PYSEC-2026-2132 (pulled in via uvicorn)
# - pyasn1 < 0.6.4: PYSEC-2026-3455/3456/3457 (pulled in via google-auth <- a2a-sdk)
constraint-dependencies = [
    "click>=8.3.3",
    "pyasn1>=0.6.4",
]

[tool.setuptools_scm]
fallback_version = "0+unknown"
tag_regex = "^v?(?P<version>.+)$"

[tool.setuptools.package-data]
opencode_a2a = ["py.typed"]

[tool.mypy]
python_version = "3.11"
files = ["src/opencode_a2a"]
show_error_codes = true
pretty = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "google.protobuf.*",
    "jsonrpc.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src/opencode_a2a --cov-report=term-missing --cov-report=json:.coverage.json --cov-fail-under=90"
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    "error:.*was deleted before being closed.*:ResourceWarning:aiosqlite.core",
]
